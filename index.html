<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мелл Дроп</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Exo+2:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: HUD top bar (logo, balance, status), mono tab row, one working screen per tab.
   Home = inventory. Settings = editor for welcome screen, memes, cases. Cyber look: grid floor,
   scanlines, corner-cut buttons and cards, cyan/magenta neon. A deliberate single dark theme. */
:root{
  --bg:#060812; --surface:#0d1226; --surface2:#141a35; --line:#1f2a52;
  --fg:#e6f1ff; --muted:#7d8bb3;
  --cyan:#00f0ff; --mag:#ff2bd6; --yel:#fcee0a; --ok:#39ff88; --bad:#ff3860;
  --r0:#8a93a8; --r1:#4fd36a; --r2:#3d8bff; --r3:#b45cff; --r4:#ff2bd6; --r5:#ff3b4e; --r6:#ffd23a;
  --display:'Russo One','Arial Black',system-ui,sans-serif;
  --body:'Exo 2',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --cut:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background-color:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;min-height:100%;
  background-image:linear-gradient(rgba(0,240,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.05) 1px,transparent 1px),
    radial-gradient(900px 520px at 88% -8%,rgba(255,43,214,.17),transparent 62%),radial-gradient(800px 520px at 0 0,rgba(0,240,255,.12),transparent 62%);
  background-size:44px 44px,44px 44px,auto,auto;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1140px;margin:0 auto}
h2{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:28px 0 12px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.sel:focus-visible,summary:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--fg);font:inherit;padding:9px 11px;border-radius:0;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan)}
input[type=checkbox]{width:auto;accent-color:var(--cyan)}
textarea{resize:vertical;min-height:96px}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.mono{font-family:var(--mono)}

.hud{position:relative;background:var(--surface);border:1px solid var(--line)}

/* top bar */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:20px 0 14px}
.logo{font-family:var(--display);font-size:30px;line-height:1;letter-spacing:.03em;text-transform:uppercase;text-shadow:0 0 18px rgba(0,240,255,.45)}
.logo i{font-style:normal;color:var(--mag);text-shadow:0 0 16px rgba(255,43,214,.7);margin:0 .06em}
.sys:empty{display:none}
.sys{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.sys b{color:var(--ok);font-weight:700}
.sys.off b{color:var(--yel)}
.bank{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bal{display:flex;align-items:center;gap:8px;padding:8px 14px;font-family:var(--mono);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--yel)}
.coin{width:16px;height:16px;flex:none}

/* buttons */
.btn{border:0;background:var(--surface2);color:var(--fg);font:700 12px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;padding:12px 16px;display:inline-flex;align-items:center;gap:8px;justify-content:center;clip-path:var(--cut);box-shadow:inset 0 0 0 1px var(--line);text-align:center}
.btn:hover:not(:disabled){background:#1a2247;box-shadow:inset 0 0 0 1px var(--cyan);color:var(--cyan)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:var(--cyan);color:#021017;box-shadow:none}
.btn.pri:hover:not(:disabled){background:#7dfaff;color:#021017;box-shadow:none}
.btn.big{padding:17px 30px;font-size:14px}
.btn.sm{padding:8px 11px;font-size:11px}
.btn.danger:hover:not(:disabled){box-shadow:inset 0 0 0 1px var(--bad);color:var(--bad)}
label.btn input{display:none}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:14px 16px;font:700 12px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--cyan);border-bottom-color:var(--cyan);text-shadow:0 0 12px rgba(0,240,255,.55)}
.tab i{font-style:normal;font-size:11px;color:var(--mag);margin-left:6px}

/* cards */
.r0{--rc:var(--r0)}.r1{--rc:var(--r1)}.r2{--rc:var(--r2)}.r3{--rc:var(--r3)}.r4{--rc:var(--r4)}.r5{--rc:var(--r5)}.r6{--rc:var(--r6)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.grid.tight{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.card{position:relative;display:flex;min-width:0;padding:1px;background:color-mix(in srgb,var(--rc) 55%,#000);clip-path:var(--cut);text-align:left}
.card .in{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;background:var(--surface);clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px));border-bottom:3px solid var(--rc)}
.card .art{aspect-ratio:1;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--rc) 34%,transparent),transparent 72%)}
.card .art svg,.card .art img{width:100%;height:100%;display:block;object-fit:contain}
.card .nm{padding:8px 10px 2px;font-weight:600;font-size:13px;line-height:1.2;min-height:2.5em;overflow-wrap:anywhere}
.card .meta{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:2px 6px;padding:0 10px 10px;font-size:11px}
.card .rl{color:var(--rc);font-family:var(--mono);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:10px}
.card .pr{font-family:var(--mono);font-weight:700;display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums;color:var(--yel)}
.card .pr .coin{width:11px;height:11px}
.card .ch{position:absolute;top:6px;left:6px;z-index:1;background:rgba(6,8,18,.85);padding:2px 6px;font-family:var(--mono);font-size:11px;color:var(--cyan)}
.card .sell{margin:0 10px 10px}
.mini{width:124px;flex:none;margin-right:8px}
.sel{cursor:pointer}
.sel:hover{background:var(--muted)}
.sel.on{background:var(--cyan)}
.sel.on .in::before{content:"";position:absolute;top:6px;right:12px;width:12px;height:12px;background:var(--cyan);z-index:2;clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
.dim{opacity:.28;pointer-events:none}
.empty{border:1px dashed var(--line);padding:28px 20px;color:var(--muted);text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:22px}
.stat{padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat span{font:700 11px var(--mono);letter-spacing:.12em;color:var(--muted)}
.stat b{font-family:var(--display);font-size:24px;font-weight:400;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat b.sm{font-size:17px}
.stat .coin{width:18px;height:18px}

/* bars */
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding:12px 14px;margin:8px 0 14px}
.bar .grp{display:flex;gap:8px;flex-wrap:wrap}
.line{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.line b{color:var(--fg);font-weight:700}

/* cases */
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:22px}
.case{background:var(--surface);border:1px solid var(--line);padding:16px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;clip-path:var(--cut);min-width:0}
.case .ico{width:120px;height:90px;display:flex;align-items:center;justify-content:center}
.case .ico svg,.case .ico img{width:100%;height:100%;object-fit:contain}
.case b{font-family:var(--display);font-weight:400;font-size:15px;text-transform:uppercase;overflow-wrap:anywhere}
.case .price{font-family:var(--mono);font-weight:700;display:inline-flex;align-items:center;gap:6px;color:var(--yel)}
.case:hover{border-color:var(--muted)}
.case.on{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 12%,var(--surface));box-shadow:inset 0 0 0 1px var(--cc)}
.stage{margin-top:16px}
.roll{position:relative;padding:14px 0}
.clip{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.strip{display:flex;will-change:transform}
.mark{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--cyan);z-index:2;box-shadow:0 0 16px var(--cyan),0 0 4px #fff}
.mark::before,.mark::after{content:"";position:absolute;left:-6px;border:7px solid transparent}
.mark::before{top:0;border-top:9px solid var(--cyan);border-bottom:0}
.mark::after{bottom:0;border-bottom:9px solid var(--cyan);border-top:0}
.act{display:flex;justify-content:center;margin-top:16px}

/* upgrader */
.up{display:grid;grid-template-columns:minmax(0,1fr) 270px minmax(0,1fr);gap:22px;align-items:start;margin-top:8px}
.panel{min-width:0}
.ringbox{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:26px}
.ring{position:relative;width:240px;max-width:100%;aspect-ratio:1}
.ring svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 8px rgba(0,240,255,.25))}
.needle{position:absolute;inset:0;transform:rotate(0deg)}
.needle::before{content:"";position:absolute;left:calc(50% - 2px);top:2%;height:48%;width:4px;background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.needle::after{content:"";position:absolute;left:calc(50% - 8px);top:calc(2% - 10px);border:8px solid transparent;border-top:0;border-bottom:12px solid var(--cyan)}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.rc b{font-family:var(--display);font-weight:400;font-size:32px;font-variant-numeric:tabular-nums}
.rc span{color:var(--muted);font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.14em}

/* dialogs */
.ov{position:fixed;inset:0;background:rgba(3,4,10,.86);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.dlg{background:var(--surface);border:1px solid var(--cyan);padding:22px;width:min(350px,100%);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;clip-path:var(--cut);box-shadow:inset 0 0 40px rgba(0,240,255,.08)}
.dlg .eyebrow{font:700 13px var(--mono);text-transform:uppercase;letter-spacing:.12em;margin:0;color:var(--cyan)}
.dlg .eyebrow.win{color:var(--ok)}.dlg .eyebrow.lose{color:var(--bad)}
.dlg .card{width:190px;max-width:100%}
.dlg p{margin:0;color:var(--muted);font-size:14px}
.dlg .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface2);border:1px solid var(--cyan);padding:10px 16px;z-index:70;font:600 13px var(--mono);max-width:calc(100vw - 32px)}
.foot{margin-top:46px;color:var(--muted);font:500 11px var(--mono);letter-spacing:.1em;text-align:center;text-transform:uppercase}

/* welcome + boot */
.wel{position:fixed;inset:0;z-index:45;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px;overflow:auto;
  background-image:linear-gradient(rgba(0,240,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.06) 1px,transparent 1px),radial-gradient(800px 500px at 80% 0,rgba(255,43,214,.22),transparent 60%),radial-gradient(800px 500px at 0 100%,rgba(0,240,255,.16),transparent 60%);background-size:44px 44px,44px 44px,auto,auto}
.wel .wbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.3}
.wp{position:relative;max-width:640px;width:100%;padding:34px 30px;display:flex;flex-direction:column;gap:16px;background:rgba(13,18,38,.9)}
.wp .tag{font:700 11px var(--mono);letter-spacing:.2em;color:var(--mag);text-transform:uppercase}
.wp h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,6vw,46px);line-height:1.05;margin:0;text-transform:uppercase;text-wrap:balance;text-shadow:3px 0 rgba(255,43,214,.55),-3px 0 rgba(0,240,255,.55)}
.wp .sub{font:700 14px var(--mono);color:var(--cyan);margin:0;letter-spacing:.04em}
.wp .txt{margin:0;color:#c3d0ee;font-size:16px;white-space:pre-line}
.wp .btn{align-self:flex-start}
.wp .small{font:500 11px var(--mono);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.boot{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;font:700 14px var(--mono);letter-spacing:.3em;color:var(--cyan)}
.boot::after{content:"_";animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* settings */
.subnav{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 4px}
.chip{border:0;background:var(--surface2);color:var(--muted);font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:9px 13px;clip-path:var(--cut);box-shadow:inset 0 0 0 1px var(--line)}
.chip:hover{color:var(--fg)}
.chip.on{background:var(--cyan);color:#021017;box-shadow:none}
.form{padding:18px;display:flex;flex-direction:column;gap:14px;margin-top:14px;max-width:720px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span,.lbl{font:700 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chk{display:flex;gap:10px;align-items:center;font-size:14px}
.pick{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.wthumb{width:120px;height:68px;background:var(--bg);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font:500 11px var(--mono);overflow:hidden}
.wthumb img{width:100%;height:100%;object-fit:cover}
.drop{display:flex;align-items:center;justify-content:center;text-align:center;padding:22px 16px;border:1px dashed var(--cyan);color:var(--cyan);font:700 12px var(--mono);letter-spacing:.06em;cursor:pointer;margin-top:14px;background:rgba(0,240,255,.04)}
.drop.over,.drop:hover{background:rgba(0,240,255,.12)}
.drop input{display:none}
.elist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.erow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px 12px;align-items:center;padding:10px}
.erow .th{width:64px;height:64px;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--rc) 34%,transparent),transparent 72%);border-bottom:3px solid var(--rc)}
.erow .th svg,.erow .th img{width:100%;height:100%;object-fit:contain;display:block}
.erow .ef{display:grid;grid-template-columns:minmax(0,2fr) minmax(110px,1fr) minmax(80px,.7fr);gap:8px}
.erow .ea{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.cpanel{padding:16px;margin-top:14px;display:flex;flex-direction:column;gap:14px}
.chead{display:grid;grid-template-columns:90px minmax(0,1fr) minmax(0,.6fr) auto;gap:10px 12px;align-items:end}
.chead .th{width:90px;height:68px}
.chead .th svg,.chead .th img{width:100%;height:100%;object-fit:contain;display:block}
.odds{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.odd{display:flex;flex-direction:column;gap:5px;min-width:0}
.odd span{font:700 10px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--rc)}
.pool{display:flex;flex-wrap:wrap;gap:6px;max-height:150px;overflow-y:auto;padding:2px}
.pool .chip{padding:6px 9px;font-size:10px}
.pool .chip.on{background:color-mix(in srgb,var(--rc) 80%,#000);color:#fff}
.cinfo{font:500 12px var(--mono);color:var(--muted)}
.cinfo b{color:var(--yel);font-weight:700}

/* Inspect screen (осмотр предмета, как в Standoff 2) */
.card[data-iid],.erow .th[data-iid]{cursor:pointer}
.card .eye{position:absolute;top:24px;right:8px;z-index:3;width:24px;height:24px;display:grid;place-items:center;padding:0;border:0;background:rgba(6,8,18,.82);color:var(--cyan)}
.card .eye svg{width:14px;height:14px}
.card .eye:hover{background:var(--cyan);color:#021017}
.inspx{position:fixed;inset:0;z-index:40;overflow:hidden;color:var(--fg);
  background:radial-gradient(1000px 640px at 68% 32%,#15306a 0,transparent 72%),linear-gradient(160deg,#0c1a3d 0,#09112a 45%,#050813 100%)}
.ix-bg{position:absolute;inset:-30%;pointer-events:none;transform:rotate(-8deg);filter:blur(22px);
  background:repeating-linear-gradient(100deg,transparent 0 9%,rgba(140,175,255,.07) 9% 15%,transparent 15% 30%)}
.ix-wm{position:absolute;right:8%;top:12%;width:min(46vmin,420px);opacity:.08;pointer-events:none}
.ix-stage{position:absolute;inset:0;--S:min(76vw,52vh,640px);display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.ix-stage.grab{cursor:grabbing}
.vglow{position:absolute;left:50%;top:50%;width:calc(var(--S)*1.35);height:calc(var(--S)*1.35);margin:calc(var(--S)*-.675) 0 0 calc(var(--S)*-.675);pointer-events:none;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--rc) 42%,transparent),transparent);animation:vpulse 3.4s ease-in-out infinite}
@keyframes vpulse{50%{opacity:.6}}
.vfloor{position:absolute;left:50%;top:calc(50% + var(--S)*.5 + 6px);width:calc(var(--S)*.7);height:calc(var(--S)*.07);margin-left:calc(var(--S)*-.35);pointer-events:none;
  background:radial-gradient(closest-side,rgba(0,0,0,.7),transparent)}
.vwrap{position:relative;width:var(--S);height:var(--S);perspective:1400px;--D:calc(var(--S)*.05)}
.vscene{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.pl{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;-webkit-user-drag:none}
.pl.mid{filter:brightness(.4) saturate(.7)}
.pl.ft{backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:translateZ(calc(var(--D)*.5))}
.pl.bk{backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:rotateY(180deg) translateZ(calc(var(--D)*.5))}
.ix-head{position:absolute;top:max(16px,env(safe-area-inset-top,0px));left:max(18px,env(safe-area-inset-left,0px));right:max(18px,env(safe-area-inset-right,0px));display:flex;gap:16px;align-items:center;pointer-events:none}
.ix-em{width:clamp(52px,9vw,88px);flex:none}
.ix-head h1{margin:0;font:400 clamp(20px,4.2vw,40px)/1.05 var(--display);text-transform:uppercase;overflow-wrap:anywhere;text-wrap:balance}
.ix-head h1 small{font-size:.55em;color:var(--rc);letter-spacing:.06em;margin-left:.6em;white-space:nowrap}
.ix-head p{margin:6px 0 0;display:flex;align-items:center;gap:6px;color:#8fa2cf;font:600 clamp(13px,2vw,18px) var(--body)}
.ix-head p .coin{width:15px;height:15px}
.vhint{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ix-hint{position:absolute;left:0;right:0;bottom:calc(104px + env(safe-area-inset-bottom,0px));text-align:center;margin:0;pointer-events:none}
.ix-foot{position:absolute;left:max(18px,env(safe-area-inset-left,0px));right:max(18px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;pointer-events:none}
.ix-foot>*{pointer-events:auto}
.ixback{font:400 clamp(16px,2.6vw,22px) var(--display);text-transform:uppercase;letter-spacing:.04em;color:var(--fg);background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.42);padding:16px clamp(30px,6vw,64px)}
.ixback:hover{background:rgba(255,255,255,.14);border-color:#fff}
.ix-act{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

@media (max-width:900px){.up{grid-template-columns:minmax(0,1fr)}.ringbox{order:-1}}
@media (max-width:640px){
  .logo{font-size:24px}
  .erow{grid-template-columns:64px minmax(0,1fr)}
  .erow .ef{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .erow .ef .in-name{grid-column:1/-1}
  .erow .ea{grid-column:1/-1;justify-content:flex-start}
  .chead{grid-template-columns:90px minmax(0,1fr)}
  .chead .ca{grid-column:1/-1}
  .odds{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wp{padding:24px 18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div>
      <div class="logo" id="logo"></div>
      <span class="sys" id="sys"></span>
    </div>
    <div class="bank">
      <div class="bal hud" id="bal"></div>
      <button class="btn" id="bonus" type="button"></button>
      <button class="btn" id="auth" type="button" data-auth="open" hidden></button>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Разделы"></nav>
  <main id="main"></main>
  <p class="foot">Виртуальные монеты · Ничего не покупается и не выводится</p>
</div>
<div id="layer"></div>
<div id="authLayer"></div>
<div id="welLayer"></div>
<div class="boot" id="boot">ЗАГРУЗКА</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ================= Утилиты ================= */
var sb=null,user=null,isAdmin=false,cloudTimer=null,started=false,cloudWarned=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('ru-RU');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const coin=()=>'<svg class="coin" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5.2" fill="var(--yel)"/><circle cx="6" cy="6" r="3.2" fill="none" stroke="rgba(0,0,0,.4)" stroke-width="1"/></svg>';
const okImg=u=>typeof u==='string'&&u.indexOf('data:image/')===0?u:'';
const RC=['#8a93a8','#4fd36a','#3d8bff','#b45cff','#ff2bd6','#ff3b4e','#ffd23a'];
const RN=['Обычная','Необычная','Редкая','Эпическая','Легендарная','Аркана','Безымянная'];
const RE=['Common','Uncommon','Rare','Epic','Legendary','Arcane','Nameless'];
const NR=RN.length;
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function flash(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}

/* ================= Конфиг (то, что редактируется в настройках) ================= */
const K_S='mell-state-v1',K_C='mell-config-v1',K_D='mell-draft-v1',K_SEEN='mell-seen-v1';
function defCfg(){
  const raw=[
   [0,'Кот в шоке',15],[0,'Дед с пивом',20],[0,'Бабка с семками',25],[0,'Вайб в 4 утра',30],[0,'Стул без ножки',18],
   [1,'Огурец-босс',70],[1,'Лысый вайб',90],[1,'Пельмень судьбы',110],[1,'Сосед сверху',130],
   [2,'Кринж-колобок',250],[2,'Золотой кринж',320],[2,'Шаурма-король',400],
   [3,'Мемный дедлайн',800],[3,'Лютый хомяк',1000],[3,'Платиновый лол',1300],
   [4,'Клоун в короне',3000],[4,'Пиксельный батя',4000],
   [5,'Тот самый мем',12000],[5,'Золотой унитаз',18000],
   [6,'Безымянный мем',60000]];
  return {v:2,site:{name:'Мелл Дроп'},
    welcome:{on:true,title:'Добро пожаловать в Мелл Дроп',sub:'Кейсы, апгрейды и контракты на виртуальные монеты',
      text:'Открывай кейсы, собирай мемы разной редкости, крути апгрейдер и подписывай контракты.\nМонеты виртуальные: ничего не покупается и не выводится.',btn:'Войти в игру',img:'',bonus:1000},
    items:raw.map((a,i)=>({id:'m'+(i+1),r:a[0],n:a[1],p:a[2],img:''})),
    cases:[
      {id:'c1',n:'Дворовый',img:'',price:null,w:[60,26,9,3.5,1.2,.25,.05],pool:[]},
      {id:'c2',n:'Элитный',img:'',price:null,w:[25,32,24,12,5,1.6,.4],pool:[]},
      {id:'c3',n:'Золотой ящик',img:'',price:null,w:[0,10,30,30,20,8,2],pool:[]}]};
}
/* Старые настройки (5 редкостей) переносятся на новые 7: 0->0, 1->2, 2->3, 3->4, 4->5 */
const MIG=[0,2,3,4,5];
function normalize(c){
  const d=defCfg();if(!c||typeof c!=='object')return d;
  const old=!(+c.v>=2);
  const mapR=r=>{r=Math.max(0,Math.round(+r||0));return old?MIG[Math.min(4,r)]:Math.min(NR-1,r)};
  const mapW=w=>{const o=new Array(NR).fill(0);w=Array.isArray(w)?w:[];
    if(old){MIG.forEach((nr,i)=>{o[nr]=Math.max(0,+w[i]||0)})}else{for(let i=0;i<NR;i++)o[i]=Math.max(0,+w[i]||0)}return o};
  const o={v:2,site:{name:String((c.site&&c.site.name)||d.site.name)},
    welcome:Object.assign({},d.welcome,c.welcome&&typeof c.welcome==='object'?c.welcome:{}),items:[],cases:[]};
  const w=o.welcome;w.on=!!w.on;w.bonus=Math.max(0,Math.round(+w.bonus||0));w.img=okImg(w.img);
  ['title','sub','text','btn'].forEach(k=>{w[k]=String(w[k]==null?'':w[k])});
  (Array.isArray(c.items)?c.items:d.items).forEach(x=>{if(x&&x.id)o.items.push({id:String(x.id),n:String(x.n||'Без названия'),r:mapR(x.r),p:Math.max(1,Math.round(+x.p||1)),img:okImg(x.img)})});
  (Array.isArray(c.cases)?c.cases:d.cases).forEach(x=>{if(x&&x.id)o.cases.push({id:String(x.id),n:String(x.n||'Кейс'),img:okImg(x.img),price:+x.price>0?Math.round(+x.price):null,w:mapW(x.w),pool:Array.isArray(x.pool)?x.pool.map(String):[]})});
  return o;
}
function loadCfg(){try{const raw=ls.get(K_C);if(raw)return normalize(JSON.parse(raw))}catch(e){}return defCfg()}
let CFG=loadCfg(),IDX={};
function reindex(){IDX={};CFG.items.forEach(x=>{IDX[x.id]=x})}
reindex();
let cfgT=null;
function saveCfg(){
  reindex();ls.set(K_D,'1');clearTimeout(cfgT);
  cfgT=setTimeout(()=>{if(!ls.set(K_C,JSON.stringify(CFG)))flash('Память браузера переполнена. Уменьши картинки или опубликуй в облако.')},300);
}

/* ================= Прогресс игрока ================= */
function loadState(){
  try{const j=JSON.parse(ls.get(K_S));
    if(j&&Array.isArray(j.inv))return {bal:Math.max(0,+j.bal||0),inv:j.inv.filter(x=>x&&x.id!=null).map(x=>({u:+x.u,id:String(x.id)})),uid:+j.uid||1,claimed:!!j.claimed}}catch(e){}
  return {bal:0,inv:[],uid:1,claimed:false};
}
let S=loadState();
function save(){ls.set(K_S,JSON.stringify(S));cloudQueue()}
function addItem(it){const u=S.uid++;S.inv.push({u,id:it.id});return u}
function invItems(){return S.inv.map(x=>({u:x.u,it:IDX[x.id]})).filter(x=>x.it).sort((a,b)=>b.it.p-a.it.p)}
function byUid(u){return S.inv.find(x=>x.u===u)}
function itOf(u){const x=byUid(u);return x?IDX[x.id]:null}

/* ================= Кейсы: шансы и цены ================= */
const avg=a=>a.reduce((s,x)=>s+x.p,0)/a.length;
function casePool(c){const set=c.pool&&c.pool.length?new Set(c.pool):null;return CFG.items.filter(x=>!set||set.has(x.id))}
function caseTables(c){
  const pool=casePool(c),by=RN.map((_,r)=>pool.filter(x=>x.r===r));
  let w=c.w.map((x,r)=>by[r].length?Math.max(0,+x||0):0),tot=w.reduce((a,b)=>a+b,0);
  if(!tot){w=by.map(a=>a.length?1:0);tot=w.reduce((a,b)=>a+b,0)}
  return {pool,by,w,tot};
}
function caseEV(c){const t=caseTables(c);if(!t.tot)return 0;return t.w.reduce((s,w,r)=>s+(w/t.tot)*(t.by[r].length?avg(t.by[r]):0),0)}
function autoPrice(c){return Math.max(10,Math.round(caseEV(c)*1.15/5)*5)}
function casePrice(c){return c.price>0?Math.round(c.price):autoPrice(c)}
function pickFrom(c){
  const t=caseTables(c);if(!t.tot)return null;
  let x=Math.random()*t.tot,r=0;
  for(;r<NR-1;r++){x-=t.w[r];if(x<0)break}
  if(!t.by[r].length||!t.w[r]){const ok=RN.map((_,k)=>k).filter(k=>t.w[k]>0&&t.by[k].length);r=ok[ok.length-1]}
  const p=t.by[r];return p[Math.floor(Math.random()*p.length)];
}

/* ================= Рисунки ================= */
function art(it){
  if(it.img)return `<img src="${esc(it.img)}" alt="${esc(it.n)}">`;
  const s=hash(it.id),c=RC[it.r],hue=(s*47+20)%360,ink='#1d1626';
  const e=s%3,m=(s>>3)%4,a=(s>>6)%3;
  const eyes=e===0?`<circle cx="40" cy="49" r="3.4" fill="${ink}"/><circle cx="60" cy="49" r="3.4" fill="${ink}"/>`
   :e===1?`<circle cx="40" cy="49" r="7.5" fill="#fff"/><circle cx="60" cy="49" r="7.5" fill="#fff"/><circle cx="42" cy="50" r="3.2" fill="${ink}"/><circle cx="58" cy="50" r="3.2" fill="${ink}"/>`
   :`<path d="M33 50q7-8 14 0M53 50q7-8 14 0" fill="none" stroke="${ink}" stroke-width="3" stroke-linecap="round"/>`;
  const mouth=m===0?`<path d="M38 64q12 12 24 0" fill="none" stroke="${ink}" stroke-width="3" stroke-linecap="round"/>`
   :m===1?`<ellipse cx="50" cy="67" rx="8" ry="6" fill="${ink}"/>`
   :m===2?`<path d="M39 67h22" stroke="${ink}" stroke-width="3" stroke-linecap="round"/>`
   :`<path d="M38 71q12-10 24 0" fill="none" stroke="${ink}" stroke-width="3" stroke-linecap="round"/>`;
  const acc=a===1?`<g fill="none" stroke="${ink}" stroke-width="2.5"><rect x="31" y="42" width="17" height="14" rx="4"/><rect x="52" y="42" width="17" height="14" rx="4"/><path d="M48 48h4"/></g>`
   :a===2?`<path d="M35 61q7-6 15 0q8-6 15 0q-7 7-15 3q-8 4-15-3z" fill="#3a2a22"/>`:'';
  const top=it.r>=4?`<polygon points="31,30 36,13 43,26 50,10 57,26 64,13 69,30" fill="#ffc83a" stroke="#7a5200" stroke-width="2" stroke-linejoin="round"/>`
   :it.r>=2?`<path d="M27 38q23-30 46 0z" fill="${c}" stroke="rgba(0,0,0,.35)" stroke-width="2"/>`:'';
  const spark=it.r>=4?`<path d="M14 20l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="${c}"/><path d="M84 66l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z" fill="${c}"/>`:'';
  return `<svg viewBox="0 0 100 100" role="img" aria-label="${esc(it.n)}"><circle cx="50" cy="54" r="30" fill="hsl(${hue} 55% 68%)" stroke="rgba(0,0,0,.35)" stroke-width="2"/>${eyes}${mouth}${acc}${top}${spark}</svg>`;
}
function crate(r){
  const c=RC[r];
  return `<svg viewBox="0 0 120 90" aria-hidden="true"><rect x="12" y="30" width="96" height="52" fill="#141a35" stroke="${c}" stroke-width="3"/><rect x="8" y="16" width="104" height="20" fill="#1c2347" stroke="${c}" stroke-width="3"/><rect x="52" y="30" width="16" height="52" fill="${c}" fill-opacity=".35"/><rect x="52" y="16" width="16" height="20" fill="${c}" fill-opacity=".6"/><circle cx="60" cy="56" r="7" fill="${c}"/><circle cx="60" cy="56" r="2.5" fill="#060812"/></svg>`;
}
const caseColor=i=>[2,3,4,5,1][i%5];
function caseIcon(c,i){return c.img?`<img src="${esc(c.img)}" alt="${esc(c.n)}">`:crate(caseColor(i))}
function card(it,o={}){
  const insp=!o.mini&&!o.noinsp;
  const cls=['card','r'+it.r,o.mini?'mini':'',o.sel?'sel':'',o.on?'on':'',o.dim?'dim':''].filter(Boolean).join(' ');
  const iid=insp&&!o.sel?` data-iid="${esc(it.id)}"`:'';
  const eye=insp&&o.sel?`<button class="eye" type="button" data-iid="${esc(it.id)}" aria-label="Осмотр" title="Осмотр"><svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M8 3C4.5 3 2 8 2 8s2.5 5 6 5 6-5 6-5-2.5-5-6-5zm0 7.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z"/></svg></button>`:'';
  return `<div class="${cls}" ${o.attrs||''}${iid}><div class="in">${eye}${o.chance?`<span class="ch">${o.chance}</span>`:''}<div class="art">${art(it)}</div><div class="nm">${esc(it.n)}</div><div class="meta"><span class="rl">${RN[it.r]}</span><span class="pr">${coin()}${fmt(it.p)}</span></div>${o.extra||''}</div></div>`;
}

/* ================= Шапка и вкладки ================= */
let tab='inv',busy=false,selCase=null,upSel=new Set(),upTarget=null,ctSel=new Set(),res=null,sub='welcome',armed=null,nextBonus=0;
const canEdit=()=>!sb||isAdmin;
function logoHTML(){
  const n=String(CFG.site.name||'Мелл Дроп').trim().toUpperCase(),i=n.indexOf(' ');
  return i>0?esc(n.slice(0,i))+'<i>//</i>'+esc(n.slice(i+1)):esc(n);
}
function hdr(){
  $('#logo').innerHTML=logoHTML();
  const nm=String(CFG.site.name||'Мелл Дроп');if(document.title!==nm)document.title=nm;
  $('#bal').innerHTML=coin().replace('class="coin"','class="coin" style="width:20px;height:20px"')+`<span>${fmt(S.bal)}</span>`;
  const left=Math.ceil((nextBonus-Date.now())/1000),b=$('#bonus');
  if(left>0){b.disabled=true;b.textContent=`Бонус через ${left} с`}else{b.disabled=false;b.textContent='Бонус +50'}
  const au=$('#auth');au.hidden=!sb;au.textContent=user?'Выйти ('+String(user.email||'').split('@')[0]+')':'Войти';
  $('#sys').className='sys'+(sb?'':' off');
  $('#sys').innerHTML=sb?(user?'Вход выполнен'+(isAdmin?' · админ':''):'Гость'):'';
  if(tab==='settings'&&!canEdit())tab='inv';
  const tabs=[['inv','Инвентарь'],['cases','Кейсы'],['upgrade','Апгрейдер'],['contract','Контракты']];
  if(canEdit())tabs.push(['settings','Настройки']);
  $('#tabs').innerHTML=tabs.map(([k,n])=>`<button class="tab ${tab===k?'on':''}" type="button" data-tab="${k}">${n}${k==='inv'?`<i>${invItems().length}</i>`:''}</button>`).join('');
}
setInterval(()=>{const left=Math.ceil((nextBonus-Date.now())/1000),b=$('#bonus');if(left>0){b.disabled=true;b.textContent=`Бонус через ${left} с`}else if(b.disabled){hdr()}},500);
$('#bonus').addEventListener('click',()=>{if(Date.now()<nextBonus)return;S.bal+=50;nextBonus=Date.now()+20000;save();hdr()});

/* ================= Инвентарь (главная) ================= */
function viewInv(){
  const inv=invItems(),total=inv.reduce((s,x)=>s+x.it.p,0);
  const cheap=inv.filter(x=>x.it.r===0);
  const bar=`<div class="bar hud"><div class="line"><b>${inv.length}</b> предметов на <b>${coin()}${fmt(total)}</b></div><div class="grp"><button class="btn pri sm" type="button" data-tab="cases">Открыть кейс</button><button class="btn sm" type="button" data-act="sellcheap" ${cheap.length?'':'disabled'}>Продать все обычные (${cheap.length})</button></div></div>`;
  const grid=inv.length?`<div class="grid">${inv.map(({u,it})=>card(it,{attrs:`data-u="${u}"`,extra:`<button class="btn sm sell" type="button" data-sell="${u}">Продать за ${fmt(it.p)}</button>`})).join('')}</div>`
    :`<div class="empty"><span>Здесь пока пусто. Открой первый кейс, и дроп появится в инвентаре.</span><button class="btn pri" type="button" data-tab="cases">К кейсам</button></div>`;
  return `<h2>Твой инвентарь</h2>`+bar+grid;
}
function sell(u){
  const it=itOf(u),k=S.inv.findIndex(x=>x.u===u);if(k<0)return;
  S.bal+=it?it.p:0;S.inv.splice(k,1);save();render();
}

/* ================= Кейсы ================= */
function curCase(){return CFG.cases.find(c=>c.id===selCase)||CFG.cases[0]||null}
function viewCases(){
  const c=curCase();
  if(!c)return `<div class="empty" style="margin-top:22px"><span>Кейсов пока нет.</span>${canEdit()?'<button class="btn pri" type="button" data-tab="settings">Добавить в настройках</button>':''}</div>`;
  const t=caseTables(c),price=casePrice(c);
  const strip=t.pool.length?Array.from({length:14},()=>card(pickFrom(c),{mini:1})).join(''):'';
  const drops=t.pool.filter(x=>t.w[x.r]>0).sort((a,b)=>b.r-a.r||b.p-a.p).map(x=>{
    const p=t.w[x.r]/t.tot/t.by[x.r].length*100;
    return card(x,{chance:(p<1?p.toFixed(2):p.toFixed(1))+'%'});
  }).join('');
  return `<div class="cases">${CFG.cases.map((x,k)=>`<button class="case ${x.id===c.id?'on':''}" type="button" data-case="${esc(x.id)}" style="--cc:${RC[caseColor(k)]}"><span class="ico">${caseIcon(x,k)}</span><b>${esc(x.n)}</b><span class="price">${coin()}${fmt(casePrice(x))}</span></button>`).join('')}</div>
  <div class="stage"><div class="roll hud"><div class="mark"></div><div class="clip"><div class="strip" id="strip">${strip}</div></div></div>
  <div class="act"><button class="btn pri big" type="button" id="openBtn" data-act="open" ${t.pool.length?'':'disabled'}>Открыть за ${coin()}${fmt(price)}</button></div></div>
  <h2>Что может выпасть</h2>${drops?`<div class="grid">${drops}</div>`:'<div class="empty">В этом кейсе нет мемов.</div>'}`;
}
async function openCase(){
  if(busy)return;
  const c=curCase();if(!c)return;
  const price=casePrice(c);
  if(S.bal<price){flash('Не хватает монет. Возьми бонус или продай предмет.');return}
  const win=pickFrom(c);if(!win){flash('В кейсе нет мемов');return}
  busy=true;S.bal-=price;hdr();$('#openBtn').disabled=true;
  const W=48,N=58,arr=[];
  for(let k=0;k<N;k++)arr.push(k===W?win:pickFrom(c));
  const strip=$('#strip'),clipW=strip.parentElement.clientWidth;
  strip.innerHTML=arr.map(it=>card(it,{mini:1})).join('');
  strip.style.transition='none';strip.style.transform='translateX(0)';void strip.offsetWidth;
  const step=132,jit=(Math.random()-.5)*88,x=clipW/2-(W*step+62+jit);
  strip.style.transition='transform 5.4s cubic-bezier(.1,.75,.12,1)';
  strip.style.transform=`translateX(${x}px)`;
  await wait(5600);
  const u=addItem(win);save();hdr();busy=false;
  const b=$('#openBtn');if(b)b.disabled=false;
  showRes({head:'Выпало',cls:'win',item:win,sub:`${RN[win.r]} · стоимость ${fmt(win.p)}`,sell:u,again:true});
}

/* ================= Апгрейдер ================= */
const UP_EDGE=0.93;
function upSum(){let s=0;upSel.forEach(u=>{const it=itOf(u);if(it)s+=it.p});return s}
function upChance(sum,t){return t?Math.min(90,sum/t.p*100*UP_EDGE):0}
function viewUp(){
  const inv=invItems();
  for(const u of [...upSel])if(!itOf(u))upSel.delete(u);
  const sum=upSum();
  const targets=sum>0?CFG.items.filter(x=>x.p>sum&&upChance(sum,x)>=1).sort((a,b)=>a.p-b.p):[];
  if(upTarget!==null&&!targets.find(x=>x.id===upTarget))upTarget=null;
  const t=upTarget!==null?IDX[upTarget]:null,ch=upChance(sum,t),C=2*Math.PI*86;
  const left=inv.length?`<div class="grid tight">${inv.map(({u,it})=>card(it,{sel:1,on:upSel.has(u),attrs:`data-up="${u}" tabindex="0"`})).join('')}</div>`
    :`<div class="empty">В инвентаре пусто. Открой кейс или возьми бонус.</div>`;
  const right=!sum?`<div class="empty">Выбери предметы слева, и здесь появятся цели.</div>`
    :targets.length?`<div class="grid tight">${targets.map(x=>card(x,{sel:1,on:upTarget===x.id,attrs:`data-target="${esc(x.id)}" tabindex="0"`,chance:upChance(sum,x).toFixed(1)+'%'})).join('')}</div>`
    :`<div class="empty">Для такой суммы целей нет. Добавь предметов.</div>`;
  return `<div class="up">
   <div class="panel"><h2>Твои предметы</h2><p class="hint">Выбери один или несколько. Их сумма станет ставкой.</p>${left}</div>
   <div class="ringbox"><div class="ring"><svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="86" fill="none" stroke="var(--mag)" stroke-opacity=".3" stroke-width="14"/><circle cx="100" cy="100" r="86" fill="none" stroke="var(--ok)" stroke-width="14" stroke-dasharray="${C*ch/100} ${C}" transform="rotate(-90 100 100)"/><circle cx="100" cy="100" r="70" fill="none" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 5"/></svg><div class="needle" id="needle"></div><div class="rc"><b>${ch.toFixed(1)}%</b><span>шанс</span></div></div>
   <div class="line">Ставка <b>${fmt(sum)}</b> → цель <b>${t?fmt(t.p):'—'}</b></div>
   <button class="btn pri big" type="button" data-act="upgrade" ${sum&&t&&!busy?'':'disabled'}>Апгрейд</button></div>
   <div class="panel"><h2>Цель</h2><p class="hint">Чем дороже цель, тем ниже шанс.</p>${right}</div></div>`;
}
async function doUpgrade(){
  if(busy)return;
  const sum=upSum(),t=upTarget!==null?IDX[upTarget]:null;
  if(!sum||!t)return;
  busy=true;
  const ch=upChance(sum,t),r=Math.random()*100,win=r<ch,nd=$('#needle');
  nd.style.transition='none';nd.style.transform='rotate(0deg)';void nd.offsetWidth;
  nd.style.transition='transform 4.6s cubic-bezier(.1,.7,.1,1)';
  nd.style.transform=`rotate(${360*5+r*3.6}deg)`;
  document.querySelectorAll('[data-act="upgrade"]').forEach(b=>b.disabled=true);
  await wait(4800);
  upSel.forEach(u=>{const k=S.inv.findIndex(x=>x.u===u);if(k>=0)S.inv.splice(k,1)});
  let u=null;if(win)u=addItem(t);
  upSel=new Set();upTarget=null;save();hdr();busy=false;
  if(win)showRes({head:'Апгрейд удался',cls:'win',item:t,sub:`Шанс был ${ch.toFixed(1)}%`,sell:u});
  else showRes({head:'Не повезло',cls:'lose',item:null,sub:`Ставка ${fmt(sum)} сгорела. Шанс был ${ch.toFixed(1)}%.`});
}

function viewContract(){

  let rar=null,sum=0;
  ctSel.forEach(u=>{const it=itOf(u);rar=it.r;sum+=it.p});
  const n=ctSel.size;
  const grid=inv.length?`<div class="grid tight">${inv.map(({u,it})=>{
    const off=it.r===NR-1||(rar!==null&&it.r!==rar);
    return card(it,{sel:1,on:ctSel.has(u),dim:off&&!ctSel.has(u),attrs:`data-ct="${u}" tabindex="0"`});
  }).join('')}</div>`:`<div class="empty">В инвентаре пусто. Открой кейс или возьми бонус.</div>`;
  const rule=rar===null?'Выбери 10 предметов одной редкости':`${RN[rar]} → ${RN[rar+1]}`;
  return `<h2>Контракт</h2><p class="hint">Отдай 10 предметов одной редкости и получи случайный предмет следующей. Безымянные в контракт не идут.</p>
  <div class="bar hud"><div class="line"><b>${n}/10</b> · ${rule} · сумма <b>${fmt(sum)}</b></div>
  <div class="grp"><button class="btn sm" type="button" data-act="ctclear" ${n?'':'disabled'}>Сбросить</button><button class="btn pri" type="button" data-act="contract" ${n===10&&!busy?'':'disabled'}>Подписать контракт</button></div></div>${grid}`;
}
function doContract(){
  if(busy||ctSel.size!==10)return;
  let rar=null,ok=true;
  ctSel.forEach(u=>{const it=itOf(u);if(rar===null)rar=it.r;else if(it.r!==rar)ok=false});
  if(!ok||rar===null||rar>=NR-1)return;
  const pool=CFG.items.filter(x=>x.r===rar+1);
  if(!pool.length){flash('В следующей редкости нет мемов. Добавь их в настройках.');return}
  const out=pool[Math.floor(Math.random()*pool.length)];
  let sum=0;
  ctSel.forEach(u=>{const k=S.inv.findIndex(x=>x.u===u);if(k>=0){sum+=(IDX[S.inv[k].id]||{p:0}).p;S.inv.splice(k,1)}});
  const u=addItem(out);ctSel=new Set();save();render();
  showRes({head:'Контракт выполнен',cls:'win',item:out,sub:`Отдано на ${fmt(sum)}, получено на ${fmt(out.p)}`,sell:u});
}

const emblem=(c,cls)=>`<svg class="${cls}" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 4 96 50 50 96 4 50z" fill="rgba(10,20,50,.7)" stroke="${c}" stroke-width="5" stroke-linejoin="round"/><path d="M50 14 86 50 50 86 14 50z" fill="none" stroke="${c}" stroke-opacity=".5" stroke-width="2"/><path d="M50 24l5.5 20.5L76 50 55.5 55.5 50 76 44.5 55.5 24 50 44.5 44.5z" fill="${c}"/></svg>`;
function plEl(it,cls,style,front){
  const h=art(it),attr=`class="pl ${cls}" style="${style}"`+(front?'':' aria-hidden="true"');
  return h.indexOf('<img ')===0?h.replace('<img ','<img '+attr+' draggable="false" '):h.replace('<svg ','<svg '+attr+' ');
}
let VW=null;
function stopViewer(){if(VW){cancelAnimationFrame(VW.raf);VW=null}}
function startViewer(){
  const vp=$('#vp'),sc=$('#vscene');if(!vp||!sc)return;
  const fl=$('#vfloor');
  const still=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const v={rx:-6,ry:still?15:-200,vx:0,vy:0,drag:false,lx:0,ly:0,idle:0,raf:0,intro:!still};
  VW=v;
  const apply=()=>{
    sc.style.transform=`rotateX(${v.rx}deg) rotateY(${v.ry}deg)`;
    fl.style.transform=`scaleX(${(.5+.5*Math.abs(Math.cos(v.ry*Math.PI/180))).toFixed(3)})`;
  };
  const tick=()=>{
    if(VW!==v)return;
    if(!v.drag){
      if(v.intro){v.ry+=(15-v.ry)*.07;if(Math.abs(15-v.ry)<.6)v.intro=false}
      else{
        v.ry+=v.vy;v.rx+=v.vx;v.vy*=.95;v.vx*=.9;v.idle++;
        if(!still&&v.idle>90)v.ry+=.3;
        v.rx+=(-6-v.rx)*.03;
      }
    }
    v.rx=Math.max(-35,Math.min(35,v.rx));
    apply();
    v.raf=requestAnimationFrame(tick);
  };
  vp.addEventListener('pointerdown',e=>{v.drag=true;v.intro=false;v.idle=0;v.lx=e.clientX;v.ly=e.clientY;v.vx=0;v.vy=0;vp.classList.add('grab');try{vp.setPointerCapture(e.pointerId)}catch(_){}});
  vp.addEventListener('pointermove',e=>{if(!v.drag)return;const dx=e.clientX-v.lx,dy=e.clientY-v.ly;v.lx=e.clientX;v.ly=e.clientY;v.ry+=dx*.7;v.rx-=dy*.5;v.vy=dx*.7;v.vx=-dy*.5});
  const end=()=>{v.drag=false;v.idle=0;vp.classList.remove('grab')};
  vp.addEventListener('pointerup',end);vp.addEventListener('pointercancel',end);
  apply();v.raf=requestAnimationFrame(tick);
}

/* ----- загрузка картинок ----- */
function readImg(file,max,q){
  return new Promise((ok,bad)=>{
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();
      im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        let u=c.toDataURL('image/webp',q);if(u.indexOf('data:image/webp')!==0)u=c.toDataURL('image/jpeg',q);ok(u)};
      im.onerror=()=>bad(new Error('img'));im.src=fr.result};
    fr.onerror=()=>bad(new Error('read'));fr.readAsDataURL(file);
  });
}
async function bulkAdd(files){

    try{const img=await readImg(f,320,.82);

  }
  if(n){saveCfg();render();flash(`Добавлено мемов: ${n}. Задай им редкость и цену.`)}else flash('Не получилось прочитать картинки');
}

    const [sec,id]=el.dataset.file.split(':');
    try{
      if(sec==='welcome'){CFG.welcome.img=await readImg(el.files[0],1280,.72)}
      else{const o=CFG[sec].find(x=>x.id===id);if(o)o.img=await readImg(el.files[0],sec==='items'?320:360,.82)}
      saveCfg();render();
    }catch(err){flash('Не получилось прочитать картинку')}
  }else if(el.dataset&&el.dataset.bulk&&el.files){bulkAdd([...el.files]);el.value=''}
  else if(el.dataset&&el.dataset.import&&el.files&&el.files[0]){
    try{const txt=await el.files[0].text();CFG=normalize(JSON.parse(txt));saveCfg();render();flash('Настройки загружены')}catch(err){flash('Файл не подходит')}
  }
});
['dragover','dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{
  const d=e.target.closest&&e.target.closest('#bulkDrop');if(!d)return;
  e.preventDefault();
  if(ev==='dragover')d.classList.add('over');else d.classList.remove('over');
  if(ev==='drop'&&e.dataTransfer&&e.dataTransfer.files)bulkAdd([...e.dataTransfer.files]);
}));
function dlCfg(){
  const b=new Blob([JSON.stringify(CFG)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='mell-drop-config.json';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function doDelete(key){
  if(key==='reset-cfg'){CFG=defCfg();saveCfg();flash('Стандартные мемы и кейсы возвращены');return}
  if(key==='reset-state'){S={bal:0,inv:[],uid:1,claimed:false};save();claimStart();flash('Прогресс сброшен');return}
  const [sec,id]=key.split(':');
  if(sec==='items'){CFG.items=CFG.items.filter(x=>x.id!==id);CFG.cases.forEach(c=>{c.pool=c.pool.filter(p=>p!==id)})}
  if(sec==='cases'){CFG.cases=CFG.cases.filter(x=>x.id!==id)}
  saveCfg();
}

/* ================= Облако (Supabase) ================= */
(function(){
  const C=window.MEMDROP_CONFIG||{};
  if(window.supabase&&C.SUPABASE_URL&&C.SUPABASE_ANON_KEY)sb=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);
})();
function cloudQueue(){if(!sb||!user)return;clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudPush,800)}
async function cloudPush(){
  if(!sb||!user)return;
  const {error}=await sb.from('profiles').upsert({user_id:user.id,balance:Math.max(0,Math.round(S.bal)),inventory:S.inv,next_uid:S.uid,updated_at:new Date().toISOString()});
  if(error&&!cloudWarned){cloudWarned=true;flash('Не удалось сохранить прогресс в облако')}
}
async function cloudPull(){
  if(!sb||!user)return;
  const {data,error}=await sb.from('profiles').select('balance,inventory,next_uid').eq('user_id',user.id).maybeSingle();
  if(error){flash('Не удалось загрузить прогресс');return}
  if(data){
    S={bal:Number(data.balance)||0,inv:(Array.isArray(data.inventory)?data.inventory:[]).filter(x=>x&&x.id!=null).map(x=>({u:+x.u,id:String(x.id)})),uid:Number(data.next_uid)||1,claimed:true};
    ls.set(K_S,JSON.stringify(S));if(started)render();
  }else await cloudPush();
}
async function checkAdmin(){
  if(!sb||!user){isAdmin=false;return}
  const {data}=await sb.from('admins').select('user_id').eq('user_id',user.id).maybeSingle();
  isAdmin=!!data;if(started)render();
}
async function fetchCloudCfg(){
  if(!sb)return null;
  try{const {data,error}=await sb.from('site_config').select('data').eq('id',1).maybeSingle();
    if(error||!data||!data.data||!Array.isArray(data.data.items))return null;return normalize(data.data)}catch(e){return null}
}
async function publishCfg(){
  if(!sb||!user||!isAdmin){flash('Публиковать может только админ');return}
  const {error}=await sb.from('site_config').upsert({id:1,data:CFG,updated_at:new Date().toISOString()});
  if(error){flash('Не получилось опубликовать: '+error.message);return}
  ls.del(K_D);flash('Опубликовано. Игроки увидят изменения при следующей загрузке.');
}
if(sb){
  sb.auth.onAuthStateChange((ev,session)=>{
    user=session?session.user:null;
    if(!user)isAdmin=false;
    if(started)hdr();
    if(user&&(ev==='SIGNED_IN'||ev==='INITIAL_SESSION'))setTimeout(async()=>{await cloudPull();await checkAdmin()},0);
  });
}
function authDialog(){
  $('#authLayer').innerHTML=`<div class="ov"><div class="dlg" role="dialog" aria-modal="true"><p class="eyebrow">Облачное сохранение</p>
  <input id="aem" type="email" placeholder="Почта" autocomplete="email">
  <input id="apw" type="password" placeholder="Пароль, от 6 символов" autocomplete="current-password">
  <p id="amsg" style="min-height:1.4em;font-size:13px"></p>
  <div class="row"><button class="btn pri" type="button" data-auth="in">Войти</button><button class="btn" type="button" data-auth="up">Регистрация</button><button class="btn" type="button" data-auth="close">Закрыть</button></div></div></div>`;
}
function authMsg(t,bad){const m=$('#amsg');if(m){m.textContent=t;m.style.color=bad?'var(--bad)':'var(--ok)'}}
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-auth]');if(!t||!sb)return;
  const a=t.dataset.auth;
  if(a==='open'){if(user){await sb.auth.signOut();user=null;isAdmin=false;render();flash('Вышел. Прогресс остался в облаке.')}else authDialog();return}
  if(a==='close'){$('#authLayer').innerHTML='';return}
  const email=($('#aem').value||'').trim(),pw=$('#apw').value||'';
  if(!email||pw.length<6){authMsg('Введи почту и пароль от 6 символов',true);return}
  authMsg('Секунду…');
  if(a==='in'){const {error}=await sb.auth.signInWithPassword({email,password:pw});
    if(error)authMsg('Не вышло войти: '+error.message,true);else $('#authLayer').innerHTML='';}
  else if(a==='up'){const {data,error}=await sb.auth.signUp({email,password:pw});
    if(error)authMsg('Не вышло зарегистрироваться: '+error.message,true);
    else if(data.session)$('#authLayer').innerHTML='';
    else authMsg('Готово. Подтверди почту по письму и войди.');}
});

/* ================= Каркас и события ================= */
function render(){
  if(!started)return;
  hdr();
  $('#main').innerHTML=tab==='inv'?viewInv():tab==='cases'?viewCases():tab==='upgrade'?viewUp():tab==='contract'?viewContract():viewSettings();
}
function toggle(set,u,max){if(set.has(u))set.delete(u);else if(!max||set.size<max)set.add(u)}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-case],[data-up],[data-target],[data-ct],[data-sell],[data-act],[data-sub],[data-pool],[data-poolall],[data-del],[data-noimg],[data-wel],[data-iid]');
  if(!t)return;
  const d=t.dataset;
  if(d.wel){$('#welLayer').innerHTML='';ls.set(K_SEEN,'1');if(d.wel==='go')claimStart();render();return}
  if(d.act==='rclose'){if(e.target===t||t.tagName==='BUTTON')closeRes();return}
  if(d.act==='rsell'){if(res&&res.sell!=null){const u=res.sell;closeRes();sell(u)}return}
  if(d.act==='ragain'){closeRes();openCase();return}
  if(busy)return;
  if(d.tab){tab=d.tab;render();return}
  if(d.case){selCase=d.case;render();return}
  if(d.up){toggle(upSel,+d.up);render();return}
  if(d.target){upTarget=upTarget===d.target?null:d.target;render();return}
  if(d.ct){toggle(ctSel,+d.ct,10);render();return}
  if(d.sell){sell(+d.sell);return}
  if(d.iid){const it=IDX[d.iid];if(it){const h=t.closest('[data-u]');showRes({head:'Осмотр',item:it,sell:h?+h.dataset.u:null})}return}
  if(d.sub){sub=d.sub;render();return}
  if(d.noimg){const [sec,id]=d.noimg.split(':');const o=CFG[sec].find(x=>x.id===id);if(o){o.img='';saveCfg();render()}return}
  if(d.poolall){const c=CFG.cases.find(x=>x.id===d.poolall);if(c){c.pool=[];saveCfg();render()}return}
  if(d.pool){
    const [cid,iid]=d.pool.split(':'),c=CFG.cases.find(x=>x.id===cid);if(!c)return;
    let p=c.pool.length?c.pool.slice():CFG.items.map(x=>x.id);
    if(p.includes(iid)){if(p.length===1){flash('В кейсе должен остаться хотя бы один мем');return}p=p.filter(x=>x!==iid)}else p.push(iid);
    c.pool=p.length>=CFG.items.length?[]:p;saveCfg();render();return;
  }
  if(d.del){
    const key=d.del;
    if(armed!==key){armed=key;render();setTimeout(()=>{if(armed===key){armed=null;render()}},2500);return}
    armed=null;doDelete(key);render();return;
  }
  const a=d.act;
  if(a==='open')openCase();
  else if(a==='upgrade')doUpgrade();
  else if(a==='contract')doContract();
  else if(a==='ctclear'){ctSel=new Set();render()}
  else if(a==='sellcheap'){S.inv=S.inv.filter(x=>{const it=IDX[x.id];if(it&&it.r===0){S.bal+=it.p;return false}return true});save();render()}
  else if(a==='wpreview')showWelcome(true);
  else if(a==='wimgdel'){CFG.welcome.img='';saveCfg();render()}
  else if(a==='additem'){CFG.items.push({id:newId('m'),n:'Новый мем',r:0,p:20,img:''});saveCfg();render()}
  else if(a==='addcase'){CFG.cases.push({id:newId('c'),n:'Новый кейс',img:'',price:null,w:[50,28,13,6,2,.8,.2],pool:[]});saveCfg();render()}
  else if(a==='export')dlCfg();
  else if(a==='publish')publishCfg();
  else if(a==='cloudload'){fetchCloudCfg().then(c=>{if(c){CFG=c;reindex();ls.set(K_C,JSON.stringify(CFG));ls.del(K_D);render();flash('Загружено из облака')}else flash('В облаке пока нет настроек')})}
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.sel')){e.preventDefault();e.target.click()}
  if(e.key==='Escape'&&res)closeRes();
  if(res&&VW){const k=e.key;VW.intro=false;VW.idle=0;
    if(k==='ArrowLeft')VW.vy-=7;else if(k==='ArrowRight')VW.vy+=7;else if(k==='ArrowUp')VW.vx+=5;else if(k==='ArrowDown')VW.vx-=5}
});

/* ================= Старт ================= */
(async function boot(){
  if(sb){
    const c=await Promise.race([fetchCloudCfg(),wait(2500).then(()=>null)]);
    if(c&&ls.get(K_D)!=='1'){CFG=c;reindex()}
  }
  started=true;
  $('#boot').remove();
  render();
  if(CFG.welcome.on&&ls.get(K_SEEN)!=='1')showWelcome(false);
  else{ls.set(K_SEEN,'1');claimStart();render()}
})();
</script>
