<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Мем-Дроп</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky top bar (logo, balance, bonus), tab row, one working screen per tab.
   Deliberately a single dark look: the screen is a game table. */
:root{
  --bg:#0e0c13; --surface:#17141f; --surface2:#211d2c; --line:#2d2839;
  --fg:#efeaf6; --muted:#9a93aa; --accent:#ffb020; --ok:#3ddc97; --bad:#ff5d6c;
  --r0:#8fa3b8; --r1:#4d8cff; --r2:#a863ff; --r3:#ff4fa6; --r4:#ffb020;
  --display:'Unbounded','Arial Black',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto}
h2{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.04em;text-transform:uppercase;margin:34px 0 14px;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.sel:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding:18px 0 14px}
.logo{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.02em;line-height:1}
.logo small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:0;margin-top:6px}
.bank{display:flex;align-items:center;gap:10px}
.bal{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums}
.coin{width:16px;height:16px;flex:none}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:9px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1a1205}
.btn.pri:hover:not(:disabled){filter:brightness(1.08);border-color:var(--accent)}
.btn.big{padding:14px 28px;font-size:16px;font-family:var(--display);font-weight:800;letter-spacing:.02em}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:6px}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 16px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--fg);border-bottom-color:var(--accent)}
.tab i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:6px}

/* cards */
.r0{--rc:var(--r0)}.r1{--rc:var(--r1)}.r2{--rc:var(--r2)}.r3{--rc:var(--r3)}.r4{--rc:var(--r4)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px}
.grid.tight{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.card{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;box-shadow:inset 0 -3px 0 var(--rc);min-width:0;text-align:left}
.card .art{aspect-ratio:1;background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--rc) 38%,transparent),transparent 72%)}
.card .art svg,.card .art img{width:100%;height:100%;display:block;object-fit:cover}
.card .nm{padding:8px 10px 2px;font-weight:600;font-size:13px;line-height:1.2;min-height:2.5em}
.card .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:0 10px 10px;font-size:12px}
.card .rl{color:var(--rc);font-weight:600}
.card .pr{font-family:var(--mono);display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.card .pr .coin{width:11px;height:11px}
.card .ch{position:absolute;top:6px;left:6px;background:rgba(14,12,19,.82);border-radius:4px;padding:2px 6px;font-family:var(--mono);font-size:11px}
.card .sell{margin:0 10px 10px}
.mini{width:124px;flex:none;margin-right:8px}
.sel{cursor:pointer;background-clip:padding-box}
.sel:hover{border-color:var(--muted)}
.sel.on{outline:2px solid var(--accent);outline-offset:-2px}
.sel.on::before{content:"";position:absolute;top:6px;right:6px;width:14px;height:14px;border-radius:50%;background:var(--accent);z-index:1;box-shadow:0 0 0 3px rgba(14,12,19,.7)}
.dim{opacity:.3;pointer-events:none}
.empty{border:1px dashed var(--line);border-radius:8px;padding:28px 20px;color:var(--muted);text-align:center}

/* cases */
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:22px}
.case{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.case svg{width:120px;height:90px}
.case b{font-family:var(--display);font-size:14px;font-weight:800}
.case .price{font-family:var(--mono);display:inline-flex;align-items:center;gap:6px}
.case:hover{border-color:var(--muted)}
.case.on{border-color:var(--cc);box-shadow:0 0 0 1px var(--cc),0 8px 30px -12px var(--cc)}
.stage{margin-top:16px}
.roll{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 0}
.clip{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.strip{display:flex;will-change:transform}
.mark{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--accent);z-index:2;box-shadow:0 0 14px var(--accent)}
.act{display:flex;justify-content:center;margin-top:16px}
.odds{color:var(--muted);font-size:13px;margin:10px 0 0;text-align:center}

/* upgrader / contracts */
.up{display:grid;grid-template-columns:minmax(0,1fr) 270px minmax(0,1fr);gap:22px;align-items:start;margin-top:8px}
.panel{min-width:0}
.panel>h2{margin-top:26px}
.ringbox{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:26px}
.ring{position:relative;width:240px;max-width:100%;aspect-ratio:1}
.ring svg{width:100%;height:100%;display:block}
.needle{position:absolute;inset:0;transform:rotate(0deg)}
.needle::before{content:"";position:absolute;left:calc(50% - 2px);top:2%;height:48%;width:4px;border-radius:2px;background:var(--fg)}
.needle::after{content:"";position:absolute;left:calc(50% - 7px);top:calc(2% - 8px);border:7px solid transparent;border-top:0;border-bottom:11px solid var(--fg);border-top-width:0}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.rc b{font-family:var(--display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.rc span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.line{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.line b{color:var(--fg);font-weight:500}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:8px 0 14px}
.bar .line{text-align:left}
.bar .grp{display:flex;gap:8px;flex-wrap:wrap}

/* result dialog */
.ov{position:fixed;inset:0;background:rgba(8,6,12,.78);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;width:min(340px,100%);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.dlg .eyebrow{font-family:var(--display);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin:0}
.dlg .eyebrow.win{color:var(--ok)}.dlg .eyebrow.lose{color:var(--bad)}
.dlg .card{width:190px;max-width:100%}
.dlg p{margin:0;color:var(--muted);font-size:14px}
.dlg .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface2);border:1px solid var(--line);padding:10px 16px;border-radius:8px;z-index:30;font-size:14px}
.foot{margin-top:44px;color:var(--muted);font-size:12px;text-align:center}

@media (max-width:900px){.up{grid-template-columns:minmax(0,1fr)}.ringbox{order:-1}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
.dlg input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--fg);font:inherit}
.dlg #amsg{min-height:1.4em;font-size:13px}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div class="logo">МЕМ-ДРОП<small>Кейсы, апгрейдер и контракты на виртуальные монеты</small></div>
    <div class="bank">
      <div class="bal" id="bal"></div>
      <button class="btn" id="bonus" type="button"></button>
      <button class="btn" id="auth" type="button" data-auth="open" hidden></button>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Разделы"></nav>
  <main id="main"></main>
  <p class="foot">Игра на виртуальных монетах. Реальных денег, покупок и вывода здесь нет.</p>
</div>
<div id="layer"></div>
<div id="authLayer"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ---------- Каталог мемов ----------
   [редкость 0..4, название, цена]
   Чтобы подставить свои картинки: добавь поле img (путь к файлу или data:-ссылку)
   в нужный предмет, например ITEMS[0].img = 'memes/kot.png'. Без img рисуется заглушка-стикер. */
const RC=['#8fa3b8','#4d8cff','#a863ff','#ff4fa6','#ffb020'];
const RN=['Ширпотреб','Редкий','Эпичный','Легендарный','Тайный'];
const RAW=[
 [0,'Кот в шоке',15],[0,'Дед с пивом',20],[0,'Бабка с семками',25],[0,'Вайб в 4 утра',30],[0,'Мем «Ну такое»',35],[0,'Стул без ножки',18],
 [1,'Огурец-босс',90],[1,'Лысый вайб',110],[1,'Пельмень судьбы',130],[1,'Сосед сверху',150],[1,'Кринж-колобок',170],
 [2,'Золотой кринж',400],[2,'Шаурма-король',520],[2,'Мемный дедлайн',650],[2,'Лютый хомяк',800],
 [3,'Платиновый лол',2000],[3,'Клоун в короне',2800],[3,'Пиксельный батя',3600],
 [4,'Тот самый мем',12000],[4,'Золотой унитаз',20000]
];
const ITEMS=RAW.map((a,i)=>({i,r:a[0],n:a[1],p:a[2]}));
const BYR=[0,1,2,3,4].map(r=>ITEMS.filter(x=>x.r===r));
const AVG=BYR.map(a=>a.reduce((s,x)=>s+x.p,0)/a.length);

/* Кейсы: w — шансы по редкостям. Цена считается от среднего выигрыша с запасом 15%. */
const CASES=[
 {name:'Дворовый',col:1,w:[74,21,4.2,.7,.1]},
 {name:'Элитный',col:2,w:[30,45,20,4.5,.5]},
 {name:'Золотой ящик',col:4,w:[0,30,45,20,5]}
];
CASES.forEach(c=>{const t=c.w.reduce((a,b)=>a+b,0);c.tot=t;const ev=c.w.reduce((s,w,r)=>s+w/t*AVG[r],0);c.price=Math.max(10,Math.round(ev*1.15/5)*5)});

/* ---------- Состояние ---------- */
const KEY='mem-drop-v1';
let S={bal:1000,inv:[],uid:1};
try{const raw=localStorage.getItem(KEY);if(raw){const j=JSON.parse(raw);if(j&&Array.isArray(j.inv)){S=j}}}catch(e){}
if(!S.inv.length&&S.bal===1000){for(let k=0;k<3;k++)addItem(BYR[0][Math.floor(Math.random()*BYR[0].length)])}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}cloudQueue()}
function addItem(it){const u=S.uid++;S.inv.push({u,i:it.i});return u}
function invItems(){return S.inv.map(x=>({u:x.u,it:ITEMS[x.i]})).sort((a,b)=>b.it.p-a.it.p)}
function byUid(u){return S.inv.find(x=>x.u===u)}

let tab='cases',busy=false,selCase=0,upSel=new Set(),upTarget=null,ctSel=new Set(),res=null;
const $=s=>document.querySelector(s);
const fmt=n=>Math.round(n).toLocaleString('ru-RU');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const coin=()=>'<svg class="coin" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="5.2" fill="var(--accent)"/><circle cx="6" cy="6" r="3.2" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="1"/></svg>';

/* ---------- Рисунки ---------- */
function art(it){
  if(it.img)return `<img src="${it.img}" alt="${it.n}">`;
  const s=it.i,c=RC[it.r],hue=(s*47+20)%360,ink='#1d1626';
  const e=s%3,m=(s*3+1)%4,a=(s*5)%3;
  const eyes=e===0?`<circle cx="40" cy="49" r="3.4" fill="${ink}"/><circle cx="60" cy="49" r="3.4" fill="${ink}"/>`
   :e===1?`<circle cx="40" cy="49" r="7.5" fill="#fff"/><circle cx="60" cy="49" r="7.5" fill="#fff"/><circle cx="42" cy="50" r="3.2" fill="${ink}"/><circle cx="58" cy="50" r="3.2" fill="${ink}"/>`
   :`<path d="M33 50q7-8 14 0M53 50q7-8 14 0" fill="none" stroke="${ink}" stroke-width="3" stroke-linecap="round"/>`;
  const mouth=m===0?`<path d="M38 64q12 12 24 0" fill="none" stroke="${ink}" stroke-width="3" stroke-linecap="round"/>`
   :m===1?`<ellipse cx="50" cy="67" rx="8" ry="6" fill="${ink}"/>`
   :m===2?`<path d="M39 67h22" stroke="${ink}" stroke-width="3" stroke-linecap="round"/>`
   :`<path d="M38 71q12-10 24 0" fill="none" stroke="${ink}" stroke-width="3" stroke-linecap="round"/>`;
  const acc=a===1?`<g fill="none" stroke="${ink}" stroke-width="2.5"><rect x="31" y="42" width="17" height="14" rx="4"/><rect x="52" y="42" width="17" height="14" rx="4"/><path d="M48 48h4"/></g>`
   :a===2?`<path d="M35 61q7-6 15 0q8-6 15 0q-7 7-15 3q-8 4-15-3z" fill="#3a2a22"/>`:'';
  const top=it.r>=3?`<polygon points="31,30 36,13 43,26 50,10 57,26 64,13 69,30" fill="#ffc83a" stroke="#7a5200" stroke-width="2" stroke-linejoin="round"/>`
   :it.r===2?`<path d="M27 38q23-30 46 0z" fill="${c}" stroke="rgba(0,0,0,.35)" stroke-width="2"/>`:'';
  const spark=it.r>=3?`<path d="M14 20l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="${c}"/><path d="M84 66l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z" fill="${c}"/>`:'';
  return `<svg viewBox="0 0 100 100" role="img" aria-label="${it.n}"><circle cx="50" cy="54" r="30" fill="hsl(${hue} 55% 68%)" stroke="rgba(0,0,0,.35)" stroke-width="2"/>${eyes}${mouth}${acc}${top}${spark}</svg>`;
}
function crate(r){
  const c=RC[r];
  return `<svg viewBox="0 0 120 90" aria-hidden="true"><rect x="12" y="30" width="96" height="52" rx="5" fill="#2a2336" stroke="${c}" stroke-width="3"/><rect x="8" y="16" width="104" height="20" rx="5" fill="#352d44" stroke="${c}" stroke-width="3"/><rect x="52" y="30" width="16" height="52" fill="${c}" fill-opacity=".35"/><rect x="52" y="16" width="16" height="20" fill="${c}" fill-opacity=".6"/><circle cx="60" cy="56" r="7" fill="${c}"/><circle cx="60" cy="56" r="2.5" fill="#1d1626"/></svg>`;
}
function card(it,o={}){
  const cls=['card','r'+it.r,o.mini?'mini':'',o.sel?'sel':'',o.on?'on':'',o.dim?'dim':''].filter(Boolean).join(' ');
  const tag=o.sel?'div':'div';
  return `<${tag} class="${cls}" ${o.attrs||''}>${o.chance?`<span class="ch">${o.chance}</span>`:''}<div class="art">${art(it)}</div><div class="nm">${it.n}</div><div class="meta"><span class="rl">${RN[it.r]}</span><span class="pr">${coin()}${fmt(it.p)}</span></div>${o.extra||''}</${tag}>`;
}

/* ---------- Шапка и вкладки ---------- */
let nextBonus=0;
function hdr(){
  $('#bal').innerHTML=coin().replace('class="coin"','class="coin" style="width:20px;height:20px"')+`<span>${fmt(S.bal)}</span>`;
  const left=Math.ceil((nextBonus-Date.now())/1000);
  const b=$('#bonus');
  if(left>0){b.disabled=true;b.textContent=`Бонус через ${left} с`}
  else{b.disabled=false;b.textContent='Взять 50 монет'}
  const au=$('#auth');au.hidden=!sb;au.textContent=user?'Выйти ('+String(user.email||'').split('@')[0]+')':'Войти';
  const tabs=[['cases','Кейсы'],['upgrade','Апгрейдер'],['contract','Контракты'],['inv','Инвентарь']];
  $('#tabs').innerHTML=tabs.map(([k,n])=>`<button class="tab ${tab===k?'on':''}" type="button" data-tab="${k}">${n}${k==='inv'?`<i>${S.inv.length}</i>`:''}</button>`).join('');
}
setInterval(()=>{const left=Math.ceil((nextBonus-Date.now())/1000);const b=$('#bonus');if(left>0){b.disabled=true;b.textContent=`Бонус через ${left} с`}else if(b.disabled){hdr()}},500);
$('#bonus').addEventListener('click',()=>{if(Date.now()<nextBonus)return;S.bal+=50;nextBonus=Date.now()+20000;save();hdr()});

function flash(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}

/* ---------- Кейсы ---------- */
function pickFrom(c){
  let x=Math.random()*c.tot,r=0;
  for(;r<4;r++){x-=c.w[r];if(x<0)break}
  while(c.w[r]===0&&r<4)r++;
  const pool=BYR[r];return pool[Math.floor(Math.random()*pool.length)];
}
function viewCases(){
  const c=CASES[selCase];
  const strip=Array.from({length:14},()=>card(pickFrom(c),{mini:1})).join('');
  const drops=ITEMS.filter(x=>c.w[x.r]>0).sort((a,b)=>b.r-a.r||b.p-a.p).map(x=>{
    const p=c.w[x.r]/c.tot/BYR[x.r].length*100;
    return card(x,{chance:(p<1?p.toFixed(2):p.toFixed(1))+'%'});
  }).join('');
  return `<div class="cases">${CASES.map((x,k)=>`<button class="case ${k===selCase?'on':''}" type="button" data-case="${k}" style="--cc:${RC[x.col]}">${crate(x.col)}<b>${x.name}</b><span class="price">${coin()}${fmt(x.price)}</span></button>`).join('')}</div>
  <div class="stage"><div class="roll"><div class="mark"></div><div class="clip"><div class="strip" id="strip">${strip}</div></div></div>
  <div class="act"><button class="btn pri big" type="button" id="openBtn" data-act="open">Открыть за ${coin()}${fmt(c.price)}</button></div></div>
  <h2>Что может выпасть</h2><div class="grid">${drops}</div>`;
}
async function openCase(){
  if(busy)return;
  const c=CASES[selCase];
  if(S.bal<c.price){flash('Не хватает монет. Возьми бонус или продай что-нибудь.');return}
  busy=true;S.bal-=c.price;hdr();$('#openBtn').disabled=true;
  const W=48,N=58,win=pickFrom(c),arr=[];
  for(let k=0;k<N;k++)arr.push(k===W?win:pickFrom(c));
  const strip=$('#strip'),clipW=strip.parentElement.clientWidth;
  strip.innerHTML=arr.map(it=>card(it,{mini:1})).join('');
  strip.style.transition='none';strip.style.transform='translateX(0)';void strip.offsetWidth;
  const step=132,jit=(Math.random()-.5)*88;
  const x=clipW/2-(W*step+62+jit);
  strip.style.transition='transform 5.4s cubic-bezier(.1,.75,.12,1)';
  strip.style.transform=`translateX(${x}px)`;
  await wait(5600);
  const u=addItem(win);save();hdr();busy=false;
  const b=$('#openBtn');if(b)b.disabled=false;
  showRes({head:'Выпало',cls:'win',item:win,sub:`${RN[win.r]} · стоимость ${fmt(win.p)}`,sell:u,again:true});
}

/* ---------- Апгрейдер ---------- */
const UP_EDGE=0.93;
function upSum(){let s=0;upSel.forEach(u=>{const x=byUid(u);if(x)s+=ITEMS[x.i].p});return s}
function upChance(sum,t){return t?Math.min(90,sum/t.p*100*UP_EDGE):0}
function viewUp(){
  const inv=invItems();
  for(const u of [...upSel])if(!byUid(u))upSel.delete(u);
  const sum=upSum();
  const targets=sum>0?ITEMS.filter(x=>x.p>sum&&upChance(sum,x)>=1).sort((a,b)=>a.p-b.p):[];
  if(upTarget!==null&&!targets.find(x=>x.i===upTarget))upTarget=null;
  const t=upTarget!==null?ITEMS[upTarget]:null;
  const ch=upChance(sum,t),C=2*Math.PI*86;
  const left=inv.length?`<div class="grid tight">${inv.map(({u,it})=>card(it,{sel:1,on:upSel.has(u),attrs:`data-up="${u}" tabindex="0"`})).join('')}</div>`
    :`<div class="empty">В инвентаре пусто. Открой кейс или возьми бонус.</div>`;
  const right=!sum?`<div class="empty">Выбери предметы слева, и здесь появятся цели.</div>`
    :targets.length?`<div class="grid tight">${targets.map(x=>card(x,{sel:1,on:upTarget===x.i,attrs:`data-target="${x.i}" tabindex="0"`,chance:upChance(sum,x).toFixed(1)+'%'})).join('')}</div>`
    :`<div class="empty">Для такой суммы целей нет. Добавь предметов.</div>`;
  return `<div class="up">
   <div class="panel"><h2>Твои предметы</h2><p class="hint">Выбери один или несколько. Их сумма станет ставкой.</p>${left}</div>
   <div class="ringbox"><div class="ring"><svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="86" fill="none" stroke="var(--bad)" stroke-opacity=".28" stroke-width="16"/><circle cx="100" cy="100" r="86" fill="none" stroke="var(--ok)" stroke-width="16" stroke-dasharray="${C*ch/100} ${C}" transform="rotate(-90 100 100)"/></svg><div class="needle" id="needle"></div><div class="rc"><b>${ch.toFixed(1)}%</b><span>шанс</span></div></div>
   <div class="line">Ставка <b>${fmt(sum)}</b> → цель <b>${t?fmt(t.p):'—'}</b></div>
   <button class="btn pri big" type="button" data-act="upgrade" ${sum&&t&&!busy?'':'disabled'}>Апгрейд</button></div>
   <div class="panel"><h2>Цель</h2><p class="hint">Чем дороже цель, тем ниже шанс.</p>${right}</div></div>`;
}
async function doUpgrade(){
  if(busy)return;
  const sum=upSum(),t=upTarget!==null?ITEMS[upTarget]:null;
  if(!sum||!t)return;
  busy=true;
  const ch=upChance(sum,t),r=Math.random()*100,win=r<ch;
  const nd=$('#needle');
  nd.style.transition='none';nd.style.transform='rotate(0deg)';void nd.offsetWidth;
  nd.style.transition='transform 4.6s cubic-bezier(.1,.7,.1,1)';
  nd.style.transform=`rotate(${360*5+r*3.6}deg)`;
  document.querySelectorAll('[data-act="upgrade"]').forEach(b=>b.disabled=true);
  await wait(4800);
  upSel.forEach(u=>{const k=S.inv.findIndex(x=>x.u===u);if(k>=0)S.inv.splice(k,1)});
  let u=null;if(win)u=addItem(t);
  upSel=new Set();upTarget=null;save();hdr();busy=false;
  if(win)showRes({head:'Апгрейд удался',cls:'win',item:t,sub:`Шанс был ${ch.toFixed(1)}%`,sell:u});
  else showRes({head:'Не повезло',cls:'lose',item:null,sub:`Ставка ${fmt(sum)} сгорела. Шанс был ${ch.toFixed(1)}%.`});
}

/* ---------- Контракты ---------- */
function viewContract(){
  const inv=invItems();
  for(const u of [...ctSel])if(!byUid(u))ctSel.delete(u);
  let rar=null,sum=0;
  ctSel.forEach(u=>{const it=ITEMS[byUid(u).i];rar=it.r;sum+=it.p});
  const n=ctSel.size;
  const grid=inv.length?`<div class="grid tight">${inv.map(({u,it})=>{
    const off=it.r===4||(rar!==null&&it.r!==rar);
    return card(it,{sel:1,on:ctSel.has(u),dim:off&&!ctSel.has(u),attrs:`data-ct="${u}" tabindex="0"`});
  }).join('')}</div>`:`<div class="empty">В инвентаре пусто. Открой кейс или возьми бонус.</div>`;
  const rule=rar===null?'Выбери 10 предметов одной редкости':`${RN[rar]} → ${RN[rar+1]}`;
  return `<h2>Контракт</h2><p class="hint">Отдай 10 предметов одной редкости и получи случайный предмет следующей. Тайные в контракт не идут.</p>
  <div class="bar"><div class="line"><b>${n}/10</b> · ${rule} · сумма <b>${fmt(sum)}</b></div>
  <div class="grp"><button class="btn sm" type="button" data-act="ctclear" ${n?'':'disabled'}>Сбросить</button><button class="btn pri" type="button" data-act="contract" ${n===10&&!busy?'':'disabled'}>Подписать контракт</button></div></div>${grid}`;
}
function doContract(){
  if(busy||ctSel.size!==10)return;
  let rar=null,ok=true;
  ctSel.forEach(u=>{const it=ITEMS[byUid(u).i];if(rar===null)rar=it.r;else if(it.r!==rar)ok=false});
  if(!ok||rar===null||rar>=4)return;
  const pool=BYR[rar+1],out=pool[Math.floor(Math.random()*pool.length)];
  let sum=0;
  ctSel.forEach(u=>{const k=S.inv.findIndex(x=>x.u===u);if(k>=0){sum+=ITEMS[S.inv[k].i].p;S.inv.splice(k,1)}});
  const u=addItem(out);ctSel=new Set();save();hdr();render();
  showRes({head:'Контракт выполнен',cls:'win',item:out,sub:`Отдано на ${fmt(sum)}, получено на ${fmt(out.p)}`,sell:u});
}

/* ---------- Инвентарь ---------- */
function viewInv(){
  const inv=invItems(),total=inv.reduce((s,x)=>s+x.it.p,0);
  const cheap=inv.filter(x=>x.it.r===0);
  const grid=inv.length?`<div class="grid">${inv.map(({u,it})=>card(it,{extra:`<button class="btn sm sell" type="button" data-sell="${u}">Продать за ${fmt(it.p)}</button>`})).join('')}</div>`
   :`<div class="empty">Пусто. Загляни в кейсы.</div>`;
  return `<h2>Инвентарь</h2><div class="bar"><div class="line"><b>${inv.length}</b> предметов на <b>${fmt(total)}</b></div>
  <div class="grp"><button class="btn sm" type="button" data-act="sellcheap" ${cheap.length?'':'disabled'}>Продать весь ширпотреб (${cheap.length})</button></div></div>${grid}`;
}
function sell(u){
  const k=S.inv.findIndex(x=>x.u===u);if(k<0)return;
  S.bal+=ITEMS[S.inv[k].i].p;S.inv.splice(k,1);save();hdr();render();
}

/* ---------- Диалог результата ---------- */
function showRes(o){
  res=o;
  const body=o.item?card(o.item):`<div class="empty" style="width:190px">Предмет не получен</div>`;
  const sellBtn=o.item&&o.sell!=null&&byUid(o.sell)?`<button class="btn" type="button" data-act="rsell">Продать за ${fmt(o.item.p)}</button>`:'';
  $('#layer').innerHTML=`<div class="ov" data-act="rclose"><div class="dlg" role="dialog" aria-modal="true"><p class="eyebrow ${o.cls||''}">${o.head}</p>${body}<p>${o.sub||''}</p><div class="row">${sellBtn}${o.again?'<button class="btn pri" type="button" data-act="ragain">Открыть ещё</button>':''}<button class="btn" type="button" data-act="rclose">Закрыть</button></div></div></div>`;
}
function closeRes(){res=null;$('#layer').innerHTML='';render()}

/* ---------- Каркас ---------- */
function render(){
  hdr();
  $('#main').innerHTML=tab==='cases'?viewCases():tab==='upgrade'?viewUp():tab==='contract'?viewContract():viewInv();
}
function toggle(set,u,max){if(set.has(u))set.delete(u);else if(!max||set.size<max)set.add(u)}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-case],[data-up],[data-target],[data-ct],[data-sell],[data-act]');
  if(!t)return;
  if(t.dataset.act==='rclose'){if(e.target===t||t.tagName==='BUTTON')closeRes();return}
  if(t.dataset.act==='rsell'){if(res&&res.sell!=null){const u=res.sell;closeRes();sell(u)}return}
  if(t.dataset.act==='ragain'){closeRes();openCase();return}
  if(busy)return;
  if(t.dataset.tab){tab=t.dataset.tab;render();return}
  if(t.dataset.case){selCase=+t.dataset.case;render();return}
  if(t.dataset.up){toggle(upSel,+t.dataset.up);render();return}
  if(t.dataset.target){upTarget=upTarget===+t.dataset.target?null:+t.dataset.target;render();return}
  if(t.dataset.ct){toggle(ctSel,+t.dataset.ct,10);render();return}
  if(t.dataset.sell){sell(+t.dataset.sell);return}
  const a=t.dataset.act;
  if(a==='open')openCase();
  else if(a==='upgrade')doUpgrade();
  else if(a==='contract')doContract();
  else if(a==='ctclear'){ctSel=new Set();render()}
  else if(a==='sellcheap'){S.inv=S.inv.filter(x=>{const it=ITEMS[x.i];if(it.r===0){S.bal+=it.p;return false}return true});save();render()}
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.sel')){e.preventDefault();e.target.click()}
  if(e.key==='Escape'&&res)closeRes();
});
/* ---------- Облако (Supabase) ---------- */
var sb=null,user=null,cloudTimer=null;
(function(){
  const CFG=window.MEMDROP_CONFIG||{};
  if(window.supabase&&CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY){
    sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
  }
})();
function cloudQueue(){
  if(!sb||!user)return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(cloudPush,800);
}
async function cloudPush(){
  if(!sb||!user)return;
  const {error}=await sb.from('profiles').upsert({user_id:user.id,balance:Math.max(0,Math.round(S.bal)),inventory:S.inv,next_uid:S.uid,updated_at:new Date().toISOString()});
  if(error)flash('Не удалось сохранить в облако');
}
async function cloudPull(){
  if(!sb||!user)return;
  const {data,error}=await sb.from('profiles').select('balance,inventory,next_uid').eq('user_id',user.id).maybeSingle();
  if(error){flash('Не удалось загрузить прогресс');return}
  if(data){
    S={bal:Number(data.balance),inv:Array.isArray(data.inventory)?data.inventory:[],uid:Number(data.next_uid)||1};
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    render();
  }else{
    await cloudPush();
  }
}
if(sb){
  sb.auth.onAuthStateChange((ev,session)=>{
    user=session?session.user:null;
    hdr();
    if(user&&(ev==='SIGNED_IN'||ev==='INITIAL_SESSION'))setTimeout(cloudPull,0);
  });
}
function authDialog(){
  $('#authLayer').innerHTML=`<div class="ov"><div class="dlg" role="dialog" aria-modal="true"><p class="eyebrow">Облачное сохранение</p>
  <input id="aem" type="email" placeholder="Почта" autocomplete="email">
  <input id="apw" type="password" placeholder="Пароль, от 6 символов" autocomplete="current-password">
  <p id="amsg"></p>
  <div class="row"><button class="btn pri" type="button" data-auth="in">Войти</button><button class="btn" type="button" data-auth="up">Регистрация</button><button class="btn" type="button" data-auth="close">Закрыть</button></div></div></div>`;
}
function authMsg(t,bad){const m=$('#amsg');if(m){m.textContent=t;m.style.color=bad?'var(--bad)':'var(--ok)'}}
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-auth]');
  if(!t||!sb)return;
  const a=t.dataset.auth;
  if(a==='open'){
    if(user){await sb.auth.signOut();user=null;hdr();flash('Вышел. Прогресс остался в облаке.')}
    else authDialog();
    return;
  }
  if(a==='close'){$('#authLayer').innerHTML='';return}
  const email=($('#aem').value||'').trim(),pw=$('#apw').value||'';
  if(!email||pw.length<6){authMsg('Введи почту и пароль от 6 символов',true);return}
  authMsg('Секунду…');
  if(a==='in'){
    const {error}=await sb.auth.signInWithPassword({email,password:pw});
    if(error)authMsg('Не вышло войти: '+error.message,true);else $('#authLayer').innerHTML='';
  }else if(a==='up'){
    const {data,error}=await sb.auth.signUp({email,password:pw});
    if(error)authMsg('Не вышло зарегистрироваться: '+error.message,true);
    else if(data.session)$('#authLayer').innerHTML='';
    else authMsg('Готово. Подтверди почту по письму и войди.');
  }
});

render();
</script>
</body>
</html>
